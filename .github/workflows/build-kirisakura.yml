name: Build Kirisakura Kernel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name for the release (leave blank to auto-generate)"
        type: string
        default: ""

env:
  CLANG_VERSION: clang-r450784e
  GCC_BRANCH: main-kernel

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            device-tree-compiler python3 cpio lz4 zip unzip rsync

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchains/clang
          key: clang-${{ env.CLANG_VERSION }}

      - name: Fetch Clang toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p toolchains
          git clone --filter=blob:none --no-checkout --depth=1 \
            -b main https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchains/clang-src
          cd toolchains/clang-src
          git sparse-checkout init --cone
          git sparse-checkout set "${CLANG_VERSION}"
          git checkout main
          cd "${GITHUB_WORKSPACE}"
          mv "toolchains/clang-src/${CLANG_VERSION}" toolchains/clang
          rm -rf toolchains/clang-src

      - name: Cache GCC arm64 toolchain
        id: cache-gcc-arm64
        uses: actions/cache@v4
        with:
          path: toolchains/gcc-arm64
          key: gcc-arm64-4.9-${{ env.GCC_BRANCH }}

      - name: Fetch GCC arm64 toolchain
        if: steps.cache-gcc-arm64.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b "${GCC_BRANCH}" \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc-arm64

      - name: Cache GCC arm32 toolchain
        id: cache-gcc-arm32
        uses: actions/cache@v4
        with:
          path: toolchains/gcc-arm32
          key: gcc-arm32-4.9-${{ env.GCC_BRANCH }}

      - name: Fetch GCC arm32 toolchain
        if: steps.cache-gcc-arm32.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b "${GCC_BRANCH}" \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchains/gcc-arm32

      - name: Build kernel
        run: |
          set -e
          mkdir -p out_cfi
          export ARCH=arm64
          export SUBARCH=arm64
          export LOCALVERSION=""
          export DTC_EXT=/usr/bin/dtc

          CLANG_PATH="$GITHUB_WORKSPACE/toolchains/clang/bin"
          GCC_ARM64_BIN="$GITHUB_WORKSPACE/toolchains/gcc-arm64/bin"
          GCC_ARM32_BIN="$GITHUB_WORKSPACE/toolchains/gcc-arm32/bin"
          export PATH="$CLANG_PATH:$GCC_ARM64_BIN:$GCC_ARM32_BIN:$PATH"

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="$GCC_ARM64_BIN/aarch64-linux-android-"
          export CROSS_COMPILE_COMPAT="$GCC_ARM32_BIN/arm-linux-androideabi-"
          export CROSS_COMPILE_ARM32="$GCC_ARM32_BIN/arm-linux-androideabi-"

          export CLANG_AR="$CLANG_PATH/llvm-ar"
          export CLANG_CC="$CLANG_PATH/clang"
          export CLANG_CCXX="$CLANG_PATH/clang++"
          export CLANG_LD="$CLANG_PATH/ld.lld"
          export CLANG_NM="$CLANG_PATH/llvm-nm"
          export CLANG_STRIP="$CLANG_PATH/llvm-strip"
          export CLANG_OC="$CLANG_PATH/llvm-objcopy"
          export CLANG_OD="$CLANG_PATH/llvm-objdump"
          export CLANG_OS="$CLANG_PATH/llvm-size"
          export CLANG_RE="$CLANG_PATH/llvm-readelf"

          export CC="$CLANG_CC"
          export HOST_CC="$CLANG_CC"
          export LD="$CLANG_LD"

          export ASUS_BUILD_PROJECT=ZS673KS
          export ASUS_ZS673KS_PROJECT

          MAKE_ARGS="LLVM=1 CC=$CLANG_CC LD=$CLANG_LD AR=$CLANG_AR STRIP=$CLANG_STRIP \
            OBJCOPY=$CLANG_OC NM=$CLANG_NM OBJDUMP=$CLANG_OD OBJSIZE=$CLANG_OS READELF=$CLANG_RE \
            HOSTCC=$CLANG_CC HOSTCXX=$CLANG_CCXX HOSTAR=$CLANG_AR HOSTLD=$CLANG_LD O=out_cfi"

          make $MAKE_ARGS kirisakura_defconfig
          make $MAKE_ARGS -j"$(nproc)"

      - name: Package flashable zip
        run: |
          set -e
          BUILD_DATE="$(date +%B%Y | tr '[:upper:]' '[:lower:]')"
          ZIP_NAME="Kirisakura-ANAKIN-ROG5-KSU-Next-v3.3.0-legacy-susfs-${BUILD_DATE}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          RELEASE_TAG="${{ inputs.release_tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v3.3.0-legacy-susfs-${BUILD_DATE}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          cp out_cfi/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          cp out_cfi/drivers/input/misc/sx932x_2nd.ko \
             AnyKernel3/modules/vendor/lib/modules/sx932x_2nd.ko
          cp out_cfi/drivers/input/touchscreen/ROG5_TP2/focaltech_fts_rog2.ko \
             AnyKernel3/modules/vendor/lib/modules/focaltech_fts_rog2.ko

          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" . \
            -x "*.git*" "*README*" "*LICENSE*" "*patch*" \
            > /dev/null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ZIP_NAME }}
